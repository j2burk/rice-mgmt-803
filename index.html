<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@600;800&family=Great+Vibes&family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-from: #6D28D9; --bg-to: #DB2777; --text: #FFFFFF; --accent: #FDE047; --card: #4C1D95;
      --on-card: #E2E8F0; color-scheme: dark;
      --title-font: "Inter", system-ui, sans-serif; --num-font: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; position: relative;
      font-family: "Inter", system-ui, sans-serif; color: var(--text);
      background: linear-gradient(-45deg, var(--bg-from), var(--bg-to), var(--bg-from), var(--bg-to));
      /* Blend through the color wheel so the fade stays saturated instead of going gray. */
      background: linear-gradient(in oklch -45deg, var(--bg-from), var(--bg-to), var(--bg-from), var(--bg-to));
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      transition: color .6s;
      display: grid; place-items: center;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      /* Glows use the theme's own colors; mixing in the accent turned them muddy. */
      background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--bg-to) 70%, transparent), transparent 55%),
                  radial-gradient(circle at 75% 75%, color-mix(in srgb, var(--bg-from) 70%, transparent), transparent 50%);
      animation: drift 16s ease-in-out infinite alternate;
      transition: background 1s;
    }
    main { position: relative; z-index: 1; text-align: center; padding: 32px 16px; width: 100%; max-width: 760px; }
    form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
    input, button {
      font: inherit; font-size: 1rem; padding: 10px 14px; border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--text) 30%, transparent);
      background: color-mix(in srgb, var(--card) 85%, transparent); color: var(--on-card);
      }
    input[type=text] { flex: 1 1 260px; max-width: 340px; }
    button { background: var(--accent); color: var(--bg-to); border: none; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #hero { font-size: clamp(4rem, 14vw, 7rem); line-height: 1; margin-bottom: 8px; }
    #hero:not(:empty) { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1); }
    h1 { font-family: var(--title-font); font-size: clamp(2rem, 7vw, 3.5rem); margin: 8px 0; font-weight: 800; }
    body[data-font=script] h1 { font-weight: 400; font-size: clamp(2.6rem, 9vw, 4.6rem); }
    #tagline { color: var(--text); opacity: .9; font-weight: 600; font-size: 1.1rem; margin: 0 0 32px; letter-spacing: .02em; }
    #out { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    #out[hidden], #hero[hidden] { display: none; }
    .unit {
      background: var(--card); border-radius: 16px; padding: 18px 12px; min-width: 110px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    }
    .num { font-family: var(--num-font); font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800;
           color: var(--accent); font-variant-numeric: tabular-nums; }
    .lbl { color: var(--on-card); font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; opacity: .8; }
    #msg { margin-top: 28px; opacity: .85; min-height: 1.5em; }

    #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    #fx span { position: absolute; top: 0; will-change: transform, opacity; }
    .snow     { animation: fall linear infinite; }
    .confetti { animation: tumble linear infinite; }
    .floating { animation: rise ease-in infinite; }
    .sparkle  { animation: twinkle ease-in-out infinite; }
    @keyframes fall    { from { transform: translate(0, -10vh) rotate(0deg); } to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); } }
    @keyframes tumble  { from { transform: translate(0, -10vh) rotate(0deg); } to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); } }
    @keyframes rise    { from { transform: translate(0, 110vh) rotate(0deg); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--drift), -15vh) rotate(var(--spin)); opacity: .2; } }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1.5) rotate(var(--spin)); } }
    @keyframes pop     { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes drift { from { transform: translate(-4%, -3%) scale(1); } to { transform: translate(4%, 3%) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      #fx { display: none; } #hero { animation: none; }
      body, body::before { animation: none; }
    }
  </style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<main>
  <form id="form">
    <input type="text" id="occasion" placeholder="What are you looking forward to?" aria-label="Occasion" required>
    <input type="date" id="date" aria-label="Date" required>
    <button type="submit" id="go">Start countdown</button>
  </form>
  <div id="hero" hidden></div>
  <h1 id="title">Countdown</h1>
  <p id="tagline"></p>
  <div id="out" hidden>
    <div class="unit"><div class="num" id="d">0</div><div class="lbl">Days</div></div>
    <div class="unit"><div class="num" id="h">0</div><div class="lbl">Hours</div></div>
    <div class="unit"><div class="num" id="m">0</div><div class="lbl">Minutes</div></div>
    <div class="unit"><div class="num" id="s">0</div><div class="lbl">Seconds</div></div>
  </div>
  <p id="msg">Tell me the occasion and the date.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const FONTS = {
    serif:   ['"Playfair Display", Georgia, serif', '"Playfair Display", Georgia, serif'],
    sans:    ['"Inter", system-ui, sans-serif', '"Inter", system-ui, sans-serif'],
    script:  ['"Great Vibes", cursive', '"Playfair Display", Georgia, serif'],
    display: ['"Bungee", system-ui, sans-serif', '"Bungee", system-ui, sans-serif'],
    mono:    ['"Space Mono", monospace', '"Space Mono", monospace'],
  };

  const DEFAULT = {
    hero: "⏳", tagline: "Counting every second",
    bg_from: "#6D28D9", bg_to: "#DB2777", text: "#FFFFFF", accent: "#FDE047", card: "#4C1D95",
    font: "sans", effect: "sparkle", particles: ["✨"],
  };

  // A handful of hand-picked themes for common occasions. Anything else falls back to DEFAULT.
  const THEMES = [
    { match: /birthday/, theme: { hero: "🎂", tagline: "Another trip around the sun in {year}",
      bg_from: "#A21CAF", bg_to: "#E11D48", text: "#FFFFFF", accent: "#FDE047", card: "#86198F",
      font: "display", effect: "confetti", particles: ["🎈", "🎉", "🎁"] } },
    { match: /wedding|marry|marriage/, theme: { hero: "💍", tagline: "Until we say I do",
      bg_from: "#DB2777", bg_to: "#9333EA", text: "#FFFFFF", accent: "#DB2777", card: "#FFFFFF",
      font: "script", effect: "floating", particles: ["🤍", "🌸"] } },
    { match: /graduat/, theme: { hero: "🎓", tagline: "The big day is almost here",
      bg_from: "#1D4ED8", bg_to: "#0369A1", text: "#FFFFFF", accent: "#FACC15", card: "#1E3A8A",
      font: "serif", effect: "confetti", particles: ["🎓", "⭐"] } },
    { match: /christmas|xmas/, theme: { hero: "🎄", tagline: "{year} is almost here",
      bg_from: "#DC2626", bg_to: "#B91C1C", text: "#FFFFFF", accent: "#FDE047", card: "#14532D",
      font: "display", effect: "snow", particles: ["❄️", "🎁"] } },
    { match: /halloween/, theme: { hero: "🎃", tagline: "Something wicked this way comes",
      bg_from: "#C2410C", bg_to: "#7C3AED", text: "#FFFFFF", accent: "#FACC15", card: "#3B0764",
      font: "display", effect: "floating", particles: ["🦇", "🕸️"] } },
    { match: /thanksgiving/, theme: { hero: "🦃", tagline: "Time to gather round",
      bg_from: "#C2410C", bg_to: "#B45309", text: "#FFFFFF", accent: "#FEF3C7", card: "#7C2D12",
      font: "serif", effect: "floating", particles: ["🍂", "🍁"] } },
    { match: /new year/, theme: { hero: "🎆", tagline: "Bring on {year}",
      bg_from: "#4338CA", bg_to: "#C026D3", text: "#FFFFFF", accent: "#FBBF24", card: "#1E1B4B",
      font: "display", effect: "sparkle", particles: ["✨", "🎉"] } },
    { match: /vacation|trip|travel|beach/, theme: { hero: "🏖️", tagline: "Sand, sun, and no schedule",
      bg_from: "#0369A1", bg_to: "#0E7490", text: "#FFFFFF", accent: "#FDE047", card: "#075985",
      font: "sans", effect: "floating", particles: ["🌴", "☀️"] } },
    { match: /retire/, theme: { hero: "🥂", tagline: "The next chapter starts in {year}",
      bg_from: "#7C3AED", bg_to: "#2563EB", text: "#FFFFFF", accent: "#FDE68A", card: "#3730A3",
      font: "serif", effect: "sparkle", particles: ["✨", "🥂"] } },
  ];

  // Lift any muted, grayish or near-black color to a saturated, mid-bright version of the same hue.
  function vivid(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    let l = (max + min) / 2, s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    l = Math.min(Math.max(l, 0.3), 0.62); s = Math.max(s, 0.75);
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h % 2 + 2) % 2 - 1)), m = l - c / 2;
    const hi = Math.floor((h + 6) % 6);
    const rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][hi];
    return "#" + rgb.map((v) => Math.round((v + m) * 255).toString(16).padStart(2, "0")).join("").toUpperCase();
  }

  function contrast(a, b) {
    const lum = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((c) => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)
      .reduce((sum, c, i) => sum + c * [0.2126, 0.7152, 0.0722][i], 0);
    const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
    return (hi + 0.05) / (lo + 0.05);
  }

  function vividTheme(t) {
    const out = { ...t, bg_from: vivid(t.bg_from), bg_to: vivid(t.bg_to) };
    const worst = (c) => Math.min(contrast(c, out.bg_from), contrast(c, out.bg_to));
    if (worst(out.text) < 4) out.text = worst("#FFFFFF") >= worst("#111827") ? "#FFFFFF" : "#111827";
    return out;
  }

  function themeFor(occasion) {
    const found = THEMES.find((t) => t.match.test(occasion.toLowerCase()));
    return vividTheme(found ? found.theme : DEFAULT);
  }

  let timer, end;

  function applyTheme(t, year) {
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries({ "bg-from": t.bg_from, "bg-to": t.bg_to, text: t.text, accent: t.accent, card: t.card })) {
      root.setProperty("--" + k, v);
    }
    // Text on the boxes and inputs: whichever of light/dark reads better on the card color.
    const lightCard = luminance(t.card) > 0.4;
    root.setProperty("--on-card", lightCard ? "#111827" : "#F8FAFC");
    root.colorScheme = lightCard ? "light" : "dark";
    const [title, num] = FONTS[t.font] || FONTS.sans;
    root.setProperty("--title-font", title);
    root.setProperty("--num-font", num);
    document.body.dataset.font = t.font;
    $("hero").textContent = t.hero;
    $("hero").hidden = false;
    $("tagline").textContent = t.tagline.replaceAll("{year}", year);
    particles(t.effect, t.particles);
  }

  function luminance(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function particles(effect, glyphs) {
    const fx = $("fx");
    fx.replaceChildren();
    if (effect === "none" || !glyphs.length) return;
    const count = effect === "sparkle" ? 26 : 40;
    const spinRange = effect === "confetti" ? [720, 1440] : effect === "sparkle" ? [-25, 25] : [-100, 100];
    for (let i = 0; i < count; i++) {
      const p = document.createElement("span");
      p.className = effect;
      p.textContent = glyphs[i % glyphs.length];
      p.style.left = Math.random() * 100 + "vw";
      p.style.fontSize = (22 + Math.random() * 46) + "px";
      p.style.setProperty("--drift", (Math.random() * 220 - 110) + "px");
      const [lo, hi] = spinRange;
      const spin = lo + Math.random() * (hi - lo);
      p.style.setProperty("--spin", (Math.random() < 0.5 ? -spin : spin) + "deg");
      p.style.animationDuration = (effect === "sparkle" ? 2 + Math.random() * 3 : 6 + Math.random() * 8) + "s";
      p.style.animationDelay = -Math.random() * 16 + "s";
      if (effect === "sparkle") p.style.top = Math.random() * 100 + "vh";
      fx.append(p);
    }
  }

  function tick() {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    $("d").textContent = Math.floor(left / 86400);
    $("h").textContent = Math.floor(left % 86400 / 3600);
    $("m").textContent = Math.floor(left % 3600 / 60);
    $("s").textContent = left % 60;
    if (left === 0) { clearInterval(timer); $("msg").textContent = "🎉 It's here! 🎉"; }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    clearInterval(timer);
    const occasion = $("occasion").value.trim(), day = $("date").value;
    // Midnight at the start of the chosen day, in the viewer's local time zone.
    const target = new Date(day + "T00:00");
    const seconds = Math.round((target - Date.now()) / 1000);
    if (seconds < 0) { $("out").hidden = true; $("msg").textContent = "That date is in the past. Pick a future date."; return; }
    applyTheme(themeFor(occasion), target.getFullYear());
    $("title").textContent = occasion;
    document.title = occasion + " countdown";
    end = Date.now() + seconds * 1000;
    $("out").hidden = false;
    $("msg").textContent = "until " + target.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    tick();
    timer = setInterval(tick, 1000);
  });
</script>
</body>
</html>
